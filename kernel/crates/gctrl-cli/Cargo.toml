[package]
name = "gctrl-cli"
version.workspace = true
edition.workspace = true

[[bin]]
name = "gctrld"
path = "src/main.rs"

# `macos-platform` flips on real FFI in driver-macos. The default-on
# default is fine because the underlying `ffi` feature in driver-macos is
# itself a no-op until the Apple framework deps land — toggling here is
# how the desktop release pipeline opts in once they do.
[features]
default = ["macos-platform"]
macos-platform = ["gctrl-driver-macos/ffi"]

[dependencies]
gctrl-core = { path = "../gctrl-core" }
gctrl-storage = { path = "../gctrl-storage" }
gctrl-otel = { path = "../gctrl-otel" }
gctrl-guardrails = { path = "../gctrl-guardrails" }
gctrl-query = { path = "../gctrl-query" }
gctrl-net = { path = "../gctrl-net" }
gctrl-context = { path = "../gctrl-context" }
gctrl-orch = { path = "../gctrl-orch" }
gctrl-proxy = { path = "../gctrl-proxy" }
gctrl-scheduler = { path = "../gctrl-scheduler" }
gctrl-driver-macos = { path = "../gctrl-driver-macos" }
reqwest = { workspace = true }

clap = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
serde_json = { workspace = true }
axum = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
notify = "7"

[dev-dependencies]
tower = { workspace = true }
tempfile = { workspace = true }
