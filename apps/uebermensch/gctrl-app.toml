# gctrl-app.toml — uebermensch install manifest
# See vault/specs/architecture/app-install-protocol.md for the full schema.

[app]
name = "uebermensch"
version = "0.2.0"
description = "Personal Chief of Staff for investors."
homepage = "https://github.com/OpenHackersClub/gctrl"
license = "MIT"

# How to launch the app's CLI. The kernel resolves this at install time.
[entrypoint]
bin = "dist/bin/uber.js"
command = "uber"
runtime = "node"

# Required capabilities — the app cannot start without these. Each one names
# a kernel capability id from the registry; the kernel resolves the registered
# default driver automatically.

[requires.llm]
description = "Curator + summary lanes for brief / report / sinkin"

[requires.deliverer.telegram]

[requires.deliverer.discord]

[requires.vault.write]

[requires.vault.sync]

[requires.secrets]

# Optional capabilities — the app starts without them and feature-gates the
# relevant code paths.

[optional.gcal]
description = "Google Calendar event apply for timeboxes"

[optional.search]
description = "Brave Search via kernel /api/search/web — used by IngestService for source discovery"

# Vault project keys this app owns. The vault root is kernel-owned; each
# subdirectory of the root is a project key. Registered in
# `gctrl_vault_mounts` so the kernel watcher knows which app owns each key.
[[vault-projects]]
key = "UBER"
description = "Uebermensch namespace — directives / input / output / action subtrees"

# Scheduler hooks. Registered as kernel `schedules` rows at install time.
[[schedule]]
name = "uber-daily-brief"
cron = "0 8 * * *"
target = "exec"
command = ["uber", "run-daily"]

# Secrets the app reads. The kernel's `driver-secrets` is the only component
# allowed to materialize values — the app calls `SecretsService.get` and
# never reads `process.env` directly.
[[secrets]]
key = "ANTHROPIC_API_KEY"
kind = "token"
required = false
description = "Anthropic API key for LLM curator + summary lanes"

# Environment variables the app reads at startup. The kernel `gctrl app install`
# flow captures these and propagates them to the launched binary. On a non-gctrl
# host (forked install per app-decoupling.md § Ejection), the operator reads
# this list to know which env vars must be set in the new environment.
[[env]]
key = "UBER_VAULT_DIR"
required = true
description = "Absolute path to the Obsidian-mountable vault holding directives/, input/, output/, action/, plus narrative docs (PRD, ROADMAP, WORKFLOW, specs/, issues/). Default for the maintainer: /Users/debuggingfuture/workspaces/df/uebermensch-vault/"

[[env]]
key = "UBER_LLM_MODEL"
required = false
description = "Override default LLM model for curator + summary lanes (e.g. claude-opus-4-7)"
