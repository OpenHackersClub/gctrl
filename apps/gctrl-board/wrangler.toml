name = "gctrl-board"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]
main = "src/worker.ts"

# Kernel facade — unmatched /api/* paths are proxied to KERNEL_URL.
# Set per-env via `wrangler secret put KERNEL_URL --env <env>` so the Worker
# can reach a publicly-routable kernel (tunnel, hosted instance, etc.).
# Leave unset to keep returning 404 for unmatched API paths.
[vars]
# KERNEL_URL = "https://kernel.example.com"

# Analytics sync cron — pulls /api/analytics/* + /api/sessions from KERNEL_URL
# into D1 every 2 minutes. No-op when KERNEL_URL is unset.
[triggers]
crons = ["*/2 * * * *"]

# Workers Static Assets — serves the Vite SPA build output.
# `not_found_handling` lives directly on [assets] — it was previously under
# a nonexistent [assets.serving] table, which wrangler warned about and
# silently ignored, so the SPA fallback was never actually deployed.
[assets]
directory = "dist-web"
binding = "ASSETS"
# SPA routing: serve index.html for all unmatched paths
# so client-side routing (e.g. /projects/*) works correctly
not_found_handling = "single-page-application"

# D1 database for board state (projects, issues, comments, events)
[[d1_databases]]
binding = "DB"
database_name = "gctrl-board-db"
database_id = "4b40671f-5e06-43b0-ad68-23434aeaca1e"
migrations_dir = "migrations"

# ── Preview environment (PR deploys) ──
[env.preview]
name = "gctrl-board-preview"

[env.preview.vars]
# KERNEL_URL = "https://kernel-preview.example.com"

[[env.preview.d1_databases]]
binding = "DB"
database_name = "gctrl-board-preview-db"
database_id = "90820d6b-e1c8-4f7d-a80d-536e9ce748bd"
migrations_dir = "migrations"
