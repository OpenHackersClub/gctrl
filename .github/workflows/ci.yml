name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # Drop type-level debuginfo on every crate (keeps panic line numbers).
  # Cuts rustc time ~10-15% and shrinks target/ so the Swatinem cache
  # save/restore is dramatically faster.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  # `-D warnings` is preserved; the linker arg is appended so mold is used
  # for every Rust link step (test binaries dominate the link cost).
  RUSTFLAGS: -D warnings -C link-arg=-fuse-ld=mold

jobs:
  # ──────────────────────────────────────────────
  # Path filter — skip build/test when only docs change
  # ──────────────────────────────────────────────
  changes:
    name: Detect changes
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          predicate-quantifier: every
          filters: |
            code:
              - '!specs/**'
              - '!**/*.md'
              - '!.github/ISSUE_TEMPLATE/**'
              - '!LICENSE'

  # ──────────────────────────────────────────────
  # Rust kernel — build & test
  # ──────────────────────────────────────────────
  rust:
    name: Rust (build + test)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v4

      # ubuntu-24.04 runners ship with ~14 GiB free; the Rust cache + target
      # dir for this workspace approaches that even with line-tables-only
      # debuginfo. Drop the two heaviest pre-installed toolchains we never
      # use; the rest of the legacy cleanup (ghc/CodeQL/docker) is not worth
      # the wall-clock cost.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android
          df -h /

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # mold is 5-10× faster than GNU ld for the workspace's many test
      # binaries; the action installs in <2s and is a no-op on cache hits.
      - name: Install mold linker
        uses: rui314/setup-mold@v1

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: kernel

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      # Single cargo invocation builds the test artifacts AND the gctrld bin
      # under one unified dep graph — `cargo test --no-run` alone does NOT
      # build the bin (gctrl-cli has no tests), so the previous separate
      # `cargo build --bin gctrld` step cold-compiled libduckdb-sys + the
      # full non-test dep tree (~9 min). Doing both in one shot saves that
      # entire duplicate compile.
      - name: Build workspace tests + kernel binary
        run: cargo build --workspace --tests --bin gctrld --locked

      - name: Run tests
        run: cargo nextest run --workspace --no-fail-fast

      # Upload the built kernel binary for the Playwright job
      - name: Upload kernel binary
        uses: actions/upload-artifact@v4
        with:
          name: gctrl-kernel
          path: target/debug/gctrld
          retention-days: 1

  # ──────────────────────────────────────────────
  # TypeScript — install, lint, test, build
  # ──────────────────────────────────────────────
  typescript:
    name: TypeScript (lint + test + build)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js + pnpm
        uses: ./.github/actions/setup-node

      - name: Biome lint
        run: pnpm exec biome lint shell/*/src/ apps/*/src/

      - name: Test — shell
        run: pnpm test
        working-directory: shell/gctrl-shell

      - name: Test — board
        run: pnpm test
        working-directory: apps/gctrl-board

      # Build web assets first: wrangler.toml references dist-web/ for [assets],
      # and the Workers runtime test harness loads that config.
      - name: Build — board web
        run: pnpm build:web
        working-directory: apps/gctrl-board

      - name: Test — board Workers runtime
        run: pnpm test:workers
        working-directory: apps/gctrl-board

      # Upload web assets for deploy and Playwright jobs
      - name: Upload board web assets
        uses: actions/upload-artifact@v4
        with:
          name: board-web-dist
          path: apps/gctrl-board/dist-web/
          retention-days: 1

  # ──────────────────────────────────────────────
  # Playwright acceptance tests
  # ──────────────────────────────────────────────
  playwright:
    name: Playwright acceptance tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [changes, rust, typescript]
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js + pnpm
        uses: ./.github/actions/setup-node

      # No `playwright install` here on purpose: cdn.playwright.dev stalls
      # from GitHub runners at arbitrary download points (main red since
      # 2026-05-27 — runs 27066616157 / 27067288096 / 27067673190 bisected
      # it), playwright's downloader has no socket timeout, and the MS
      # mirror 403s on Chrome-for-Testing artifacts. Instead the tests
      # drive the runner image's preinstalled Chrome stable via
      # PLAYWRIGHT_CHANNEL=chrome (see playwright.config.ts), which needs
      # no download at all.
      - name: Download kernel binary
        uses: actions/download-artifact@v4
        with:
          name: gctrl-kernel
          path: target/debug/

      - name: Make kernel binary executable
        run: chmod +x target/debug/gctrld

      - name: Run Playwright tests
        run: pnpm exec playwright test
        working-directory: apps/gctrl-board
        env:
          CI: "true"
          PLAYWRIGHT_CHANNEL: chrome
          GCTRL_KERNEL_PORT: "14318"
          GCTRL_VITE_PORT: "14200"
          GCTRL_KERNEL_BIN: ${{ github.workspace }}/target/debug/gctrld

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: apps/gctrl-board/playwright-report/
          retention-days: 7
