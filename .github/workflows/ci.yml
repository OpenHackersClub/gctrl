name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # Drop type-level debuginfo on every crate (keeps panic line numbers).
  # Cuts rustc time ~10-15% and shrinks target/ so the Swatinem cache
  # save/restore is dramatically faster.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  # `-D warnings` is preserved; the linker arg is appended so mold is used
  # for every Rust link step (test binaries dominate the link cost).
  RUSTFLAGS: -D warnings -C link-arg=-fuse-ld=mold

jobs:
  # ──────────────────────────────────────────────
  # Path filter — skip build/test when only docs change
  # ──────────────────────────────────────────────
  changes:
    name: Detect changes
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          predicate-quantifier: every
          filters: |
            code:
              - '!specs/**'
              - '!**/*.md'
              - '!.github/ISSUE_TEMPLATE/**'
              - '!LICENSE'

  # ──────────────────────────────────────────────
  # Rust kernel — build & test
  # ──────────────────────────────────────────────
  rust:
    name: Rust (build + test)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v4

      # ubuntu-24.04 runners ship with ~14 GiB free; the Rust cache + target
      # dir for this workspace approaches that even with line-tables-only
      # debuginfo. Drop the two heaviest pre-installed toolchains we never
      # use; the rest of the legacy cleanup (ghc/CodeQL/docker) is not worth
      # the wall-clock cost.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android
          df -h /

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # mold is 5-10× faster than GNU ld for the workspace's many test
      # binaries; the action installs in <2s and is a no-op on cache hits.
      - name: Install mold linker
        uses: rui314/setup-mold@v1

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: kernel

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      # Single cargo invocation builds the test artifacts AND the gctrld bin
      # under one unified dep graph — `cargo test --no-run` alone does NOT
      # build the bin (gctrl-cli has no tests), so the previous separate
      # `cargo build --bin gctrld` step cold-compiled libduckdb-sys + the
      # full non-test dep tree (~9 min). Doing both in one shot saves that
      # entire duplicate compile.
      - name: Build workspace tests + kernel binary
        run: cargo build --workspace --tests --bin gctrld --locked

      - name: Run tests
        run: cargo nextest run --workspace --no-fail-fast

      # Upload the built kernel binary for the Playwright job
      - name: Upload kernel binary
        uses: actions/upload-artifact@v4
        with:
          name: gctrl-kernel
          path: target/debug/gctrld
          retention-days: 1

  # ──────────────────────────────────────────────
  # TypeScript + hooks — offloaded to FlareDispatch
  #
  # The whole non-Rust suite (biome lint, shell tests, board tests, web
  # build, Workers-runtime tests, shellcheck + bats) executes in a CF Sandbox
  # container on the hosted Dispatcher, not on a GHA runner. This step is
  # fire-and-forget: it exits in seconds on HTTP 202 and is NOT the pass/fail
  # signal — the real verdict is the `flare-dispatch/offload-test` check-run
  # the Dispatcher posts back to this SHA via the FlareDispatch GitHub App.
  # The production deploy gate (deploy.yml) polls that check-run.
  #
  # ONE combined dispatch, not one per concern: the Action's idempotency key
  # is `{run}-{repo}-{sha}` (inputs are not hashed) and the check-run name is
  # not yet overridable, so two `offload-test` dispatches on the same SHA
  # would collapse into a single execution upstream.
  #
  # Rust stays on GHA: the sandbox image carries no Rust toolchain, and the
  # workspace build (libduckdb-sys) would not fit the run's 1800 s ceiling.
  # ──────────────────────────────────────────────
  dispatch:
    name: Dispatch TS + hooks (FlareDispatch)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - name: FlareDispatch not configured — skipping
        if: vars.FLAREDISPATCH_ENDPOINT == ''
        run: |
          echo "::notice::dispatch skipped — FLAREDISPATCH_ENDPOINT is not set."
          echo "Set repo variable FLAREDISPATCH_ENDPOINT and secret FLAREDISPATCH_HMAC to enable."

      - name: Dispatch offload-test
        if: vars.FLAREDISPATCH_ENDPOINT != ''
        uses: OpenHackersClub/flare-dispatch/actions/flare-dispatch-action@ba0e2e2c09b35e4096b70f557bb138df071624a0
        with:
          run: offload-test
          endpoint: ${{ vars.FLAREDISPATCH_ENDPOINT }}
          hmac-secret: ${{ secrets.FLAREDISPATCH_HMAC }}
          # Org-wide FlareDispatch App installation — lets the Dispatcher mint
          # the installation token for the check-run callback on first contact.
          installation-id: "134414514"
          # PR events: clone the PR head from the head repo (handles fork PRs).
          # push events: clone the pushed SHA from this repo.
          # Hooks deps (shellcheck + bats) install first — cheap, fails fast on
          # an image/env problem before the long pnpm install.
          inputs: |
            {
              "repo": "${{ github.event.pull_request.head.repo.full_name || github.repository }}",
              "sha": "${{ github.event.pull_request.head.sha || github.sha }}",
              "command": "apt-get update -q && apt-get install -y -q shellcheck bats && shellcheck shell/hooks/*.sh && bats shell/hooks/test/ && pnpm install --no-frozen-lockfile && pnpm exec biome lint shell/*/src/ apps/*/src/ && cd shell/gctrl-shell && pnpm test && cd ../../apps/gctrl-board && pnpm test && pnpm build:web && pnpm test:workers",
              "timeoutSec": 1500
            }
          mode: fire-and-forget

  # ──────────────────────────────────────────────
  # Playwright acceptance tests
  # ──────────────────────────────────────────────
  playwright:
    name: Playwright acceptance tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [changes, rust]
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js + pnpm
        uses: ./.github/actions/setup-node

      # The browser download from cdn.playwright.dev intermittently hangs
      # after reaching 100% (observed on main and PR branches; the job then
      # burns its full 20-min timeout in this step). Cache the browsers so
      # most runs skip the download entirely, and bound each install attempt
      # so a hang costs 4 minutes, not the whole job.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        timeout-minutes: 10
        run: |
          for attempt in 1 2; do
            timeout 240 pnpm exec playwright install chromium && exit 0
            echo "::warning::playwright install attempt ${attempt} hung; retrying"
          done
          exit 1
        working-directory: apps/gctrl-board

      # OS deps are not cached with the browsers; install them every run.
      - name: Install Playwright system dependencies
        run: pnpm exec playwright install-deps chromium
        working-directory: apps/gctrl-board

      - name: Download kernel binary
        uses: actions/download-artifact@v4
        with:
          name: gctrl-kernel
          path: target/debug/

      - name: Make kernel binary executable
        run: chmod +x target/debug/gctrld

      - name: Run Playwright tests
        run: pnpm exec playwright test
        working-directory: apps/gctrl-board
        env:
          CI: "true"
          GCTRL_KERNEL_PORT: "14318"
          GCTRL_VITE_PORT: "14200"
          GCTRL_KERNEL_BIN: ${{ github.workspace }}/target/debug/gctrld

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: apps/gctrl-board/playwright-report/
          retention-days: 7
