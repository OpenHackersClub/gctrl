[workspace]
resolver = "2"
members = [
    "kernel/crates/gctrl-core",
    "kernel/crates/gctrl-cli",
    "kernel/crates/gctrl-storage",
    "kernel/crates/gctrl-otel",
    "kernel/crates/gctrl-guardrails",
    "kernel/crates/gctrl-query",
    "kernel/crates/gctrl-proxy",
    "kernel/crates/gctrl-net",
    "kernel/crates/gctrl-sync",
    "kernel/crates/gctrl-context",
    "kernel/crates/gctrl-orch",
    "kernel/crates/gctrl-scheduler",
    "kernel/crates/gctrl-gcal",
    "kernel/crates/gctrl-driver-macos",
    "kernel/crates/gctrl-browser",
    "kernel/crates/gctrl-recorder",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/debuggingfuture/gctrl"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# Web framework
axum = "0.8"

# Async stream helpers (used for SSE response bodies in gctrl-otel)
async-stream = "0.3"
futures-core = "0.3"

# CLI
clap = { version = "4", features = ["derive"] }

# HTTP client
reqwest = { version = "0.12", features = ["json", "stream"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Time
chrono = { version = "0.4", features = ["serde"] }

# Storage
duckdb = { version = "1.2", features = ["bundled"] }

# Error handling
thiserror = "2"
anyhow = "1"

# Async trait
async-trait = "0.1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# UUID
uuid = { version = "1", features = ["v4", "serde"] }

# Arrow/Parquet (for R2 sync)
arrow = "54"
parquet = "54"

# MITM Proxy
hudsucker = "0.24"

# Hashing
sha2 = "0.10"

# URL parsing
url = "2"

# Feed parsing (RSS 2.0 + Atom + JSON Feed) — used by driver-rss
feed-rs = "2"

# Filesystem paths
dirs = "6"

# WebSocket client (outbound proxy to Chromium browser-level CDP endpoint)
tokio-tungstenite = "0.24"
futures-util = "0.3"

# Random + encoding (per-session bearer tokens for driver-browser)
getrandom = "0.2"
base64 = "0.22"

# Chromium binary autodetect for driver-browser
which = "7"

# Testing
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["trace"] }
http = "1"
http-body-util = "0.1"
tempfile = "3"
